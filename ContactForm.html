<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    
    <h2>Contact Form</h2>
    <form action="" method="post">
        <label for="">Nom Complet*</label><br>
        <input type="text" name="" placeholder="Nom Complet " id="" required><br>
        <label for="">Email*</label><br>
        <input type="email" name="" placeholder="Email " id="" required><br>
        <label for="">Sujet*</label><br>
        <input type="text" name="" placeholder="Sujet" id="" required><br>
        <label for="">Ville</label><br>
        <select name="" id="" required>
            <option value="">Selectionnez La Ville</option>
            <option value="">Casa</option>
            <option value="">Rabat</option>
            <option value="">Fes</option>
            <option value="">Tanger</option>
        </select><br>
        <label for="">Message* </label><br>
        <textarea name="" rows="10" cols="60" id="" placeholder="Votre Message ..." required></textarea><br>
        <button type="submit">Envoyer Le Message</button>
        <button type="reset">Annuler</button>



    </form>
</body>
</html>
